<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Founder Product Compiler: from founder brief to Codex-ready build contract</title>
  <desc id="desc">A dark blue product diagram showing Founder Brief, Product IR, Readiness, Goal DAG, and Codex.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07142d"/>
      <stop offset="1" stop-color="#102b5c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#45e0bd"/>
      <stop offset="1" stop-color="#64a8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020817" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#background)"/>
  <circle cx="1130" cy="-30" r="300" fill="#2e75d8" opacity=".13"/>
  <circle cx="70" cy="630" r="260" fill="#18b99b" opacity=".08"/>
  <text x="72" y="88" fill="#63e5c3" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="700" letter-spacing="3">FOUNDER PRODUCT COMPILER</text>
  <text x="72" y="155" fill="#ffffff" font-family="Inter,Segoe UI,sans-serif" font-size="48" font-weight="800">Build beyond Fable.</text>
  <text x="72" y="198" fill="#c8d7f2" font-family="Inter,Segoe UI,sans-serif" font-size="24">Turn founder intent into a validated build contract Codex can execute.</text>
  <text x="72" y="244" fill="#89a5d1" font-family="Inter,Segoe UI,sans-serif" font-size="18">Preserve the product thesis from the first brief through implementation review.</text>
  <g filter="url(#shadow)">
    <rect x="72" y="324" width="200" height="126" rx="18" fill="#10264d" stroke="#37649e" stroke-width="2"/>
    <rect x="312" y="324" width="200" height="126" rx="18" fill="#10264d" stroke="#37649e" stroke-width="2"/>
    <rect x="552" y="324" width="200" height="126" rx="18" fill="#10264d" stroke="#37649e" stroke-width="2"/>
    <rect x="792" y="324" width="200" height="126" rx="18" fill="#10264d" stroke="#37649e" stroke-width="2"/>
    <rect x="1032" y="324" width="176" height="126" rx="18" fill="#153d61" stroke="#45e0bd" stroke-width="2"/>
  </g>
  <g fill="#ffffff" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <text x="172" y="380">Founder Brief</text>
    <text x="412" y="380">Product IR</text>
    <text x="652" y="380">Readiness</text>
    <text x="892" y="380">Goal DAG</text>
    <text x="1120" y="380">Codex</text>
  </g>
  <g fill="#9fb8df" font-family="Inter,Segoe UI,sans-serif" font-size="15" text-anchor="middle">
    <text x="172" y="412">intent + thesis</text>
    <text x="412" y="412">typed product model</text>
    <text x="652" y="412">gaps before coding</text>
    <text x="892" y="412">vertical slices</text>
    <text x="1120" y="412">coherent execution</text>
  </g>
  <g stroke="url(#accent)" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M272 387h33"/><path d="M512 387h33"/><path d="M752 387h33"/><path d="M992 387h33"/>
  </g>
  <g fill="#64a8ff">
    <path d="M305 387l-11-8v16z"/><path d="M545 387l-11-8v16z"/><path d="M785 387l-11-8v16z"/><path d="M1025 387l-11-8v16z"/>
  </g>
  <text x="72" y="550" fill="#89a5d1" font-family="Inter,Segoe UI,sans-serif" font-size="18">Product coherence for coding agents · local-first · Apache-2.0</text>
  <text x="1208" y="550" fill="#63e5c3" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="end">github.com/plugtheliam/founder-product-compiler</text>
</svg>
